name: Core tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: '1'
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Provision the explicit CI package manager
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.10'
          enable-cache: false
      - name: Install locked test dependencies in the disposable CI environment
        run: uv sync --frozen --extra skill-validation --no-default-groups --no-install-project --no-build --python '${{ matrix.python }}'
      - name: Report actual runtime and run tests
        run: |
          .venv/bin/python --version
          .venv/bin/python -B -m unittest discover -s tests -q
